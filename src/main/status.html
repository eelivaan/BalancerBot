<!DOCTYPE html>
<html>
<!--
    The status display that bot sends as response to GET / requests over WLAN.
    String interpolation is used to fill sections marked with percent sign.
-->

<head>
    <title>Pico Status</title>
    <style>
        html {
            color-scheme: light dark;
            font-family: monospace;
            line-height: 1.5;
            margin-left: 15px;
        }
    </style>
</head>

<body>
    <h2>Pico Status</h2>
    <div>
        <p>Battery: %.2f V | MCU time: %s</p>
        <button id="quitbtn">Shutdown Pico</button>
        <button id="bootbtn">Boot Pico</button>
        <button id="testbtn">Test Connection</button>
        <label id="response-status" style="color: red"></label>
        <label id="response-text" style="color: gray"></label>
    </div>
    <h2>Directory Tree</h2>
    <div>
        %s
    </div>
    <script>
        function addPostCMD(btnID, cmd) {
            let btn = document.getElementById(btnID);
            btn.addEventListener('click', async () => {
                const response = await fetch(window.location.pathname, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: cmd,
                });
                // display response
                document.getElementById('response-status').style.color = (response.status === 200) ? "lightgreen" : "red";
                document.getElementById('response-status').textContent = response.status + ' ' + response.statusText;
                document.getElementById('response-text').textContent = await response.text();
                // clear response display after 2 s
                setTimeout(() => {
                    document.getElementById('response-status').textContent = '';
                    document.getElementById('response-text').textContent = '';
                }, 2000);

            });
        }
        addPostCMD('quitbtn', 'QUIT');
        addPostCMD('bootbtn', 'BOOT');
        addPostCMD('testbtn', 'PING');
    </script>
</body>

</html>

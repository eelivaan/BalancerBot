<!DOCTYPE html>
<html>

<head>
    <title>Pico Status</title>
    <style>
        html {
            color-scheme: light dark;
            font-family: monospace;
            line-height: 1.5;
            margin-left: 15px;
        }
    </style>
</head>

<body>
    <h2>Pico Status</h2>
    <div>
        <p>Battery: %.2f V | Local time: %s</p>
        <button id="quitbtn">Shutdown Pico</button>
        <button id="bootbtn">Boot Pico</button>
    </div>
    <h2>Directory Tree</h2>
    <div>
        %s
    </div>
    <script>
        function addPostCMD(btnID, cmd) {
            document.getElementById(btnID).addEventListener('click', async () => {
                await fetch(window.location.pathname, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: cmd,
                });
            });
        }
        addPostCMD('quitbtn', 'QUIT');
        addPostCMD('bootbtn', 'BOOT');
    </script>
</body>

</html>
